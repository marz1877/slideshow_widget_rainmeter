LeftMouseUpAction=[!CommandMeasure MeasureLua "ShuffleAll()"]
DynamicVariables=1

[MeterShuffleIcon]
Meter=Image
ImageName=#CURRENTPATH#shuffle.png
W=(18*#Scale#)
H=(18*#Scale#)
X=((#BoardW#-23-9)*#Scale#)
Y=((#BoardH#-23-9)*#Scale#)
ImageTint=255,255,255,200
ImageAlpha=200
AntiAlias=1
DynamicVariables=1

; --- RESIZE CAPTURE ZONE ---
; MUST be last meter in file so it is topmost in Z-order and captures mouse-up
; during a resize drag before any slot/image meters can steal the event.
[MeterResizeCaptureZone]
Meter=Shape
Shape=Rectangle 0,0,(#BoardW#*#Scale#),(#BoardH#*#Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0
X=0
Y=0
Hidden=1
LeftMouseUpAction=[!CommandMeasure MeasureLua "EndResize($MouseX$, $MouseY$)"][!HideMeter MeterResizeCaptureZone][!Redraw]
DynamicVariables=1

