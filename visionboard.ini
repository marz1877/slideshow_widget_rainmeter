[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
; --- RIGHT-CLICK SCALE & SETTINGS MENU ---
ContextTitle=Edit Image Paths & Count...
ContextAction=[!Execute ""#CURRENTPATH#visionboard-paths.ini""]
ContextTitle2=Reload Paths & Count
ContextAction2=[!Refresh]
ContextTitle3=----------
ContextAction3=[]
ContextTitle4=Scale Up (+0.05)
ContextAction4=[!CommandMeasure MeasureLua "ScaleStep(0.05)"]
ContextTitle5=Scale Down (-0.05)
ContextAction5=[!CommandMeasure MeasureLua "ScaleStep(-0.05)"]
ContextTitle6=Small (0.35)
ContextAction6=[!CommandMeasure MeasureLua "SetScale(0.35)"]
ContextTitle7=Medium (0.50)
ContextAction7=[!CommandMeasure MeasureLua "SetScale(0.50)"]
ContextTitle8=Large (0.75)
ContextAction8=[!CommandMeasure MeasureLua "SetScale(0.75)"]
ContextTitle9=Full (1.00)
ContextAction9=[!CommandMeasure MeasureLua "SetScale(1.00)"]
ContextTitle10=Reset Scale
ContextAction10=[!CommandMeasure MeasureLua "ResetScale()"]
ContextTitle11=----------
ContextAction11=[]
ContextTitle12=Layout: 1 Image (Hero)
ContextAction12=[!CommandMeasure MeasureLua "SetImageCount(1)"]
ContextTitle13=Layout: 2 Images (Golden Split)
ContextAction13=[!CommandMeasure MeasureLua "SetImageCount(2)"]
ContextTitle14=Layout: 3 Images (Golden Trio)
ContextAction14=[!CommandMeasure MeasureLua "SetImageCount(3)"]
ContextTitle15=Layout: 4 Images (Editorial)
ContextAction15=[!CommandMeasure MeasureLua "SetImageCount(4)"]
ContextTitle16=Layout: 5 Images (Editorial)
ContextAction16=[!CommandMeasure MeasureLua "SetImageCount(5)"]
ContextTitle17=Layout: 6 Images (Editorial)
ContextAction17=[!CommandMeasure MeasureLua "SetImageCount(6)"]
ContextTitle18=Layout: 7 Images (Editorial Classic)
ContextAction18=[!CommandMeasure MeasureLua "SetImageCount(7)"]
ContextTitle19=Layout: 8 Images (Editorial)
ContextAction19=[!CommandMeasure MeasureLua "SetImageCount(8)"]
ContextTitle20=Layout: 9 Images (Editorial)
ContextAction20=[!CommandMeasure MeasureLua "SetImageCount(9)"]
ContextTitle21=Layout: 10 Images (Editorial)
ContextAction21=[!CommandMeasure MeasureLua "SetImageCount(10)"]
ContextTitle22=Layout: 12 Images (Editorial Dual Hero)
ContextAction22=[!CommandMeasure MeasureLua "SetImageCount(12)"]
ContextTitle23=Grid: 15 Images
ContextAction23=[!CommandMeasure MeasureLua "SetImageCount(15)"]
ContextTitle24=Grid: 20 Images
ContextAction24=[!CommandMeasure MeasureLua "SetImageCount(20)"]
ContextTitle25=Grid: 25 Images
ContextAction25=[!CommandMeasure MeasureLua "SetImageCount(25)"]

[Variables]
@include="#CURRENTPATH#visionboard-paths.ini"
FileFilter=*.jpg;*.jpeg;*.png;*.bmp;*.gif;*.webp;*.jfif;*.avif

; --- SCALE CONFIGURATION ---
Scale=0.75

; --- PANEL SIZE (set by Lua based on ImageCount) ---
BoardW=595
BoardH=620

; --- WINDOWS 11 GLASS v8.7 TOKENS ---
ColorSurface=20,20,20,225
ColorCardRest=255,255,255,20
ColorCardHover=255,255,255,45
ColorAccent=0,220,255
ColorOnSurface=255,255,255
Radius=(28*#Scale#)
Padding=(4*#Scale#)

; Glass Highlights
ColorGlassBorder=255,255,255,50
ColorGlassBorderHover=255,255,255,100

; --- SLOT GEOMETRY (X,Y,W,H at Scale=1.0, set by Lua) ---
; Artistic defaults for 7 slots:
