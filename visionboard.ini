ScriptFile=visionboard.lua

; =====================
; STYLES
; =====================

[StyleImage]
PreserveAspectRatio=2
SolidColor=0,0,0,1
DynamicVariables=1
Group=Slots

[StyleArrow]
FontFace=Segoe UI Light
FontSize=(10*#Scale#)
FontColor=255,255,255,180
StringStyle=BOLD
StringAlign=CenterCenter
AntiAlias=1
DynamicVariables=1
Group=Arrows
Hidden=1
W=(24*#Scale#)
H=(24*#Scale#)

[StyleArrowBg]
Shape=Ellipse (12*#Scale#),(12*#Scale#),(12*#Scale#) | Fill Color 255,255,255,50 | StrokeWidth (1*#Scale#) | Stroke Color 255,255,255,100
W=(24*#Scale#)
H=(24*#Scale#)
Group=Arrows
Hidden=1
DynamicVariables=1

; =====================
; METERS
; =====================

[MeterBackdrop]
Meter=Shape
Shape=Rectangle 0,0,(#BoardW#*#Scale#),(#BoardH#*#Scale#),#Radius# | Fill Color #ColorSurface# | StrokeWidth (0.5*#Scale#) | Stroke Color 255,255,255,30
X=0
Y=0
DynamicVariables=1

; --- TOP-LEFT RESIZE HANDLE ---
; Click & Drag from top-left corner:
; MouseDown shows overlay to capture drag anywhere across the skin; MouseUp applies new scale.
[MeterResizeHandle]
Meter=Shape
Shape=Rectangle 0,0,(32*#Scale#),(32*#Scale#),#Radius# | Fill Color 0,0,0,1 | StrokeWidth 0
X=0
Y=0
MouseActionCursor=1
MouseActionCursorName=SIZE_NWSE
ToolTipText="Scroll to resize · Drag inward to shrink · Double-click to reset"
ToolTipType=0
LeftMouseDownAction=[!CommandMeasure MeasureLua "StartResize()"][!ShowMeter MeterResizeCaptureZone][!Redraw]
LeftMouseDoubleClickAction=[!CommandMeasure MeasureLua "ResetScale()"]
MouseScrollUpAction=[!CommandMeasure MeasureLua "ScaleStep(0.05)"]
MouseScrollDownAction=[!CommandMeasure MeasureLua "ScaleStep(-0.05)"]
MouseOverAction=[!SetOption MeterResizeIcon Shape "Path ResizeGrip | Stroke Color 255,255,255,220 | StrokeWidth (1.5*#Scale#) | StrokeLineCap Round"][!Redraw]
MouseLeaveAction=[!SetOption MeterResizeIcon Shape "Path ResizeGrip | Stroke Color 255,255,255,90 | StrokeWidth (1.5*#Scale#) | StrokeLineCap Round"][!Redraw]
DynamicVariables=1

[MeterResizeIcon]
Meter=Shape
Shape=Path ResizeGrip | Stroke Color 255,255,255,90 | StrokeWidth (1.5*#Scale#) | StrokeLineCap Round
ResizeGrip=(6*#Scale#),(14*#Scale#) | LineTo (6*#Scale#),(6*#Scale#) | LineTo (14*#Scale#),(6*#Scale#)
X=0
Y=0
DynamicVariables=1

; --- SLOT 1 ---
[Slot1Background]
Meter=Shape
Shape=Rectangle 0,0,(#SlotW1#*#Scale#),(#SlotH1#*#Scale#),#Radius# | Fill Color #ColorCardRest# | StrokeWidth (1*#Scale#) | Stroke Color #ColorGlassBorder#
X=(#SlotX1#*#Scale#)
Y=(#SlotY1#*#Scale#)
Group=Slot1 | AllSlots
DynamicVariables=1

[Slot1Container]
Meter=Shape
Shape=Rectangle #Padding#,#Padding#,((#SlotW1#*#Scale#)-(#Padding#*2)),((#SlotH1#*#Scale#)-(#Padding#*2)),(#Radius#-#Padding#) | Fill Color 255,255,255,255 | StrokeWidth 0
X=(#SlotX1#*#Scale#)
Y=(#SlotY1#*#Scale#)
Group=Slot1 | AllSlots
DynamicVariables=1

[MeterImage1]
Meter=Image
MeasureName=MeasureImage1
MeterStyle=StyleImage
W=(#SlotW1#*#Scale#)
H=(#SlotH1#*#Scale#)
Container=Slot1Container
ToolTipText=#Name1#
ToolTipType=0
Group=Slot1 | AllSlots
MouseOverAction=[!SetOption Slot1Background Shape "Rectangle 0,0,(#SlotW1#*#Scale#),(#SlotH1#*#Scale#),#Radius# | Fill Color #ColorCardHover# | StrokeWidth (1.5*#Scale#) | Stroke Color #ColorGlassBorderHover#"][!ShowMeterGroup Slot1Arrows][!Redraw]
MouseLeaveAction=[!SetOption Slot1Background Shape "Rectangle 0,0,(#SlotW1#*#Scale#),(#SlotH1#*#Scale#),#Radius# | Fill Color #ColorCardRest# | StrokeWidth (1*#Scale#) | Stroke Color #ColorGlassBorder#"][!HideMeterGroup Slot1Arrows][!Redraw]

[MeterNext1Bg]
Meter=Shape
MeterStyle=StyleArrowBg
Group=Arrows | Slot1Arrows | Slot1 | AllSlots
X=((#SlotX1#+#SlotW1#-24)*#Scale#)
Y=((#SlotY1#+#SlotH1#-24)*#Scale#)

[MeterNext1]
Meter=String
MeterStyle=StyleArrow
Group=Arrows | Slot1Arrows | Slot1 | AllSlots
X=((#SlotX1#+#SlotW1#-12)*#Scale#)
Y=((#SlotY1#+#SlotH1#-12)*#Scale#)
Text=>
LeftMouseUpAction=[!UpdateMeasure MeasureImage1][!UpdateMeter MeterImage1][!Redraw]

