; =====================================================
; VisionBoard - Image Paths Configuration
; =====================================================
; Edit this file to configure which folders each slot
; pulls images from.
;
; HOW TO USE:
;   1. Edit the paths below (use full Windows paths)
;   2. Leave a Slot blank to use the Root folder
;   3. Right-click the widget -> "Reload Paths"
;
; NOTES:
;   - Subfolders=1 includes images in sub-folders
;   - Subfolders=0 only uses images directly in the folder
;   - UpdateDiv = seconds between automatic image changes
;     (Rainmeter updates at 1s, so this is multiplied by that)
; =====================================================

[Variables]
UpdateDiv=120
; Number of images displayed (1-25)
; Counts 1-7 use curated editorial / golden ratio layouts. Counts 8-25 use grid mode.
ImageCount=12

; Default / Root image folder (used when a slot is left blank)
ImgPath=D:\
Subfolders=1

; --- Per-slot paths (leave blank to use ImgPath) ---
